spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB
  config:
    import: optional:file:.env[.properties]
  application:
    name: server
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

app:
  base-url: http://localhost:5000

server:
  tomcat:
    max-part-count: 50
  port: 5000

